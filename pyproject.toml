[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithms"
version = "1.0.1"
description = "Pythonic Data Structures and Algorithms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Algorithms Team & Contributors", email = "kwk236@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/keon/algorithms"
Repository = "https://github.com/keon/algorithms"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "black",
]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "tools", "tools.*", "docs", "docs.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["algorithms"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = false

[tool.black]
line-length = 88
target-version = ["py310"]

[dependency-groups]
dev = [
    "ipytest>=0.14.2",
    "ipywidgets>=8.1.9",
    "jupytext>=1.19.5",
    "memory-profiler>=0.61.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "numpy>=2.2.6",
    "plotly>=7.0.0",
    "polars>=1.44.1",
    "scipy>=1.15.3",
    "tqdm>=4.70.0",
]
